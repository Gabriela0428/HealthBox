<!doctype html>
<html lang="es">
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2f8f78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<title>HealthBox</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f8fb;color:#17324d}header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #dce7ef}header img{width:150px;max-width:55%;border-radius:24px}main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #00000012}input{display:block;width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #bbcbd7;border-radius:8px}button{background:#2f8f78;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px}.small{font-size:13px;color:#607487}
</style>
</head>
<body>
<header><img src="icons/healthbox-logo.jpeg" alt="HealthBox"><h1>HealthBox</h1><p>Salud y cuidado en cada etapa</p></header>
<main>
<section class="card"><h2>Datos de salud</h2><label>Presión arterial</label><input id="presion" placeholder="Ej. 120/80"><label>Frecuencia cardiaca</label><input id="fc" type="number" placeholder="Ej. 72"><label>Glucosa</label><input id="glucosa" type="number" placeholder="Ej. 100"><button onclick="guardar()">Guardar datos</button><p id="mensaje"></p></section>
<section class="card"><h2>Últimos datos</h2><p id="datos">Aún no hay datos guardados.</p><p class="small">HealthBox es una herramienta de apoyo y no sustituye la valoración de un profesional de la salud.</p></section>
</main>
<script>
function mostrar(){const d=JSON.parse(localStorage.getItem('healthboxDatos')||'null');if(d)document.getElementById('datos').textContent=`Presión: ${d.presion||'—'} | FC: ${d.fc||'—'} lpm | Glucosa: ${d.glucosa||'—'} mg/dL`}
function guardar(){const d={presion:document.getElementById('presion').value,fc:document.getElementById('fc').value,glucosa:document.getElementById('glucosa').value};localStorage.setItem('healthboxDatos',JSON.stringify(d));mostrar();document.getElementById('mensaje').textContent='Datos guardados en este dispositivo.'}
if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');mostrar();
</script>
</body></html>
